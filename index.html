<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDIZ Portal — Le portail numérique de l'écosystème industriel</title>
  <meta name="description" content="GDIZ Portal — La plateforme numérique officielle de la Zone Industrielle de Glo-Djigbé.">
  <link rel="canonical" href="https://gdizportal.bj/">
  <meta property="og:url" content="https://gdizportal.bj/">
  <meta property="og:title" content="GDIZ Portal">
  <meta property="og:image" content="https://gdizportal.bj/assets/img/gdiz-logo.png">
  <link rel="icon" type="image/png" href="assets/img/gdiz-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gdiz-blue:   #302F7F;
      --gdiz-yellow: #F0B310;
      --gdiz-red:    #EF463B;
      --gdiz-green:  #00A950;
    }

    html, body {
      width: 100%; height: 100%;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: #ffffff;
      color: #0F172A;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle dot grid */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(rgba(48,47,127,0.06) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* Full-screen centered flex container */
    .screen {
      position: relative; z-index: 1;
      width: 100%; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem;
      gap: 0;
    }

    /* Logo */
    .logo {
      width: 220px;
      margin-bottom: 2.5rem;
    }

    /* Divider accent */
    .accent-bar {
      width: 48px; height: 3px;
      background: linear-gradient(90deg, var(--gdiz-yellow), var(--gdiz-red));
      margin-bottom: 1.75rem;
    }

    /* Headline */
    h1 {
      font-size: clamp(1.6rem, 3.5vw, 2.6rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      text-align: center;
      line-height: 1.15;
      color: var(--gdiz-blue);
      margin-bottom: 1rem;
    }

    /* Sub-text */
    p {
      font-size: clamp(0.95rem, 1.3vw, 1.1rem);
      font-weight: 500;
      color: #475569;
      text-align: center;
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 2.25rem;
    }

    /* CTA Button — sharp with offset shadow */
    .btn-cta {
      background: var(--gdiz-yellow);
      color: #0F172A;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      padding: 0.8rem 2.25rem;
      border: 1.5px solid #0F172A;
      box-shadow: 4px 4px 0px #0F172A;
      display: inline-flex; align-items: center; gap: 0.6rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.14s ease;
    }

    .btn-cta:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #0F172A;
      background: #f8c025;
      color: #000;
    }

    /* Lang switcher — top right */
    .lang-toggle {
      position: fixed; top: 1.25rem; right: 1.5rem;
      display: flex; border: 1px solid #CBD5E1;
      font-size: 0.73rem; font-weight: 700; z-index: 10;
    }

    .lang-btn {
      background: none; border: none;
      padding: 4px 10px; cursor: pointer;
      color: #64748B; transition: all 0.15s;
    }

    .lang-btn.active { background: var(--gdiz-blue); color: #fff; }

    /* Footer line */
    footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 0.6rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.7rem; color: #94A3B8;
      border-top: 1px solid #E2E8F0;
      background: #ffffff;
    }

    /* Mobile */
    @media (max-width: 580px) {
      html, body { overflow-y: auto; }
      .screen { height: auto; min-height: 100vh; padding: 4rem 1.5rem 5rem; }
      .logo { width: 180px; }
    }
  </style>
</head>
<body>

  <!-- Language Switcher -->
  <div class="lang-toggle">
    <button class="lang-btn active" data-lang="fr" onclick="setLang('fr')">FR</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
  </div>

  <!-- Single Screen -->
  <div class="screen">
    <img src="assets/img/gdiz-logo.png" alt="GDIZ Logo" class="logo">

    <div class="accent-bar"></div>

    <h1 id="title">Le portail numérique<br>de l'écosystème industriel</h1>

    <p id="desc">Accédez aux services, démarches et opérations<br>de la Zone Industrielle de Glo-Djigbé.</p>

    <a href="#" class="btn-cta" onclick="alert('Plateforme en cours de déploiement.'); return false;">
      <span id="cta">Accéder aux services</span>
      <i class="fa-solid fa-arrow-right"></i>
    </a>
  </div>

  <!-- Footer -->
  <footer>
    <span>© 2026 GDIZ Portal</span>
    <span>Glo-Djigbé Industrial Zone • Zè-Bénin</span>
  </footer>

  <script>
    const texts = {
      fr: {
        title: 'Le portail numérique<br>de l\'écosystème industriel',
        desc: 'Accédez aux services, démarches et opérations<br>de la Zone Industrielle de Glo-Djigbé.',
        cta: 'Accéder aux services'
      },
      en: {
        title: 'The digital gateway<br>to the industrial ecosystem',
        desc: 'Access services, procedures and operations<br>at Glo-Djigbé Industrial Zone.',
        cta: 'Access Services'
      }
    };

    function setLang(lang) {
      document.getElementById('title').innerHTML = texts[lang].title;
      document.getElementById('desc').innerHTML = texts[lang].desc;
      document.getElementById('cta').textContent = texts[lang].cta;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      document.documentElement.lang = lang;
    }
  </script>
</body>
</html>
