<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page non trouvée — GDIZ Portal</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="icon" type="image/png" href="assets/img/gdiz-logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .not-found-wrapper {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: var(--gdiz-blue);
      line-height: 1;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="page-background">
    <div class="bg-pattern-grid"></div>
  </div>

  <div class="not-found-wrapper position-relative z-1">
    <img src="assets/img/gdiz-logo.png" alt="GDIZ Logo" style="height: 48px; margin-bottom: 2rem;">
    <div class="error-code">404</div>
    <h2 class="fw-bold mb-2">Page non trouvée</h2>
    <p class="text-secondary mb-4" style="max-width: 420px;">
      La ressource demandée n'existe pas ou a été déplacée sur la plateforme GDIZ Portal.
    </p>
    <a href="/" class="btn-gdiz-primary text-decoration-none">
      <i class="fa-solid fa-arrow-left me-2"></i> Retour à l'accueil
    </a>
  </div>
</body>
</html>
